# openSUSE Leap 42.3 x86_64 chroot for the xCAT dependency build.
#
# WHY THIS TARGET EXISTS: the sles12 cell publishes packages for the SLE 12 family, and Leap
# 42.3 is the openSUSE build of it (42.3 shares SLE 12 SP3's base: rpm 4.11.2, perl 5.18.2,
# glibc 2.22). This mirrors sles15, which is built in a Leap 15.6 chroot rather than on SLE
# media. Building on the public counterpart keeps the cell reproducible without a subscription.
#
# WHY NOT THE SLE 12 SP5 MEDIA: the Server DVD is a GA medium with no SDK, and the SDK is where
# SLE puts the development packages. nasm, libuuid-devel, readline-devel and tmux are all absent
# from it, so ipmitool-xcat, syslinux-xcat and the genesis payload cannot be built there at all.
# Leap 42.3 carries every one of them.
#
# Leap 42.3 is end of life, so it is served from the openSUSE discontinued archive rather than
# from a live mirror. mock ships no config for it, and the tree predates the layout mock expects:
# its rpm-md metadata is under repo/oss/suse/, not repo/oss/.
#
# mock builds its bootstrap chroot by installing python3-dnf from the target's repos, and 42.3
# has no python3-dnf. Install straight into the chroot with the host package manager instead.
config_opts['root'] = 'opensuse-leap-42.3-x86_64'
config_opts['description'] = 'openSUSE Leap 42.3 x86_64 (xCAT dependency build, SLE 12 family)'
config_opts['target_arch'] = 'x86_64'
config_opts['legal_host_arches'] = ('x86_64',)
config_opts['dist'] = 'suse.lp423'
config_opts['releasever'] = '42.3'
config_opts['macros']['%dist'] = '.suse.lp423'
# Leap 42.3 ships rpm 4.11, which predates these macros. The Fedora source rpms this build
# rebuilds call them, and an undefined macro reaches the shell verbatim: %build then dies with
# "fg: no job control" rather than saying a macro is missing. %{?_smp_mflags} rpm 4.11 defines.
config_opts['macros']['%make_build'] = 'make %{?_smp_mflags}'
config_opts['macros']['%make_install'] = 'make install DESTDIR=%{buildroot} ; find %{buildroot} -name perllocal.pod -delete ; find %{buildroot} -name .packlist -delete'
config_opts['macros']['%license'] = '%doc'
config_opts['package_manager'] = 'dnf'
config_opts['use_bootstrap_image'] = False
config_opts['use_bootstrap'] = False
config_opts['extra_chroot_dirs'] = [ '/run/lock', ]
config_opts['ssl_ca_bundle_path'] = '/var/lib/ca-certificates/ca-bundle.pem'

# Leap 42.3 names the build pattern the Leap way, not the SLE way.
config_opts['chroot_setup_cmd'] = 'install patterns-openSUSE-devel_basis rpm-build'

config_opts['dnf.conf'] = """
[main]
keepcache=1
debuglevel=2
reposdir=/dev/null
logfile=/var/log/yum.log
retries=20
obsoletes=1
gpgcheck=0
assumeyes=1
syslog_ident=mock
syslog_device=
install_weak_deps=0
metadata_expire=0
best=1
excludepkgs=*.i586,*.i686
protected_packages=

[leap-42.3-oss]
name=openSUSE Leap 42.3 - x86_64 - OSS
baseurl=http://ftp.gwdg.de/pub/opensuse/discontinued/distribution/leap/42.3/repo/oss/suse/
enabled=1
gpgcheck=0

[leap-42.3-update]
name=openSUSE Leap 42.3 - x86_64 - Update
baseurl=http://ftp.gwdg.de/pub/opensuse/discontinued/update/leap/42.3/oss/
enabled=1
gpgcheck=0
"""
